name: Android APK

on:
  push:
    branches:
      - main
      - 'ccr-**'
    tags:
      - 'v*'
    paths:
      - 'game/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach the APKs to the GitHub release on v* tags

defaults:
  run:
    working-directory: game

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Secrets cannot be tested in `if:` directly: expose a boolean instead.
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default ('tools platform-tools') fails: the legacy 'tools' package no
          # longer exists. Gradle downloads the platform / build-tools it needs (licenses accepted).
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        run: (cd android && ./gradlew assembleDebug --no-daemon --stacktrace)

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-corsair-debug-apk
          path: game/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-corsair-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nova-corsair-release.jks" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: (cd android && ./gradlew assembleRelease --no-daemon --stacktrace)

      - name: Upload release APK
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nova-corsair-release-apk
          path: game/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Name APKs for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "$RUNNER_TEMP/release-apks"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/release-apks/nova-corsair-${GITHUB_REF_NAME}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release-apks/nova-corsair-${GITHUB_REF_NAME}.apk"
          fi
          ls -la "$RUNNER_TEMP/release-apks"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release-apks/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Remove keystore
        if: always() && env.HAS_RELEASE_KEYSTORE == 'true'
        run: rm -f "$RUNNER_TEMP/nova-corsair-release.jks"
