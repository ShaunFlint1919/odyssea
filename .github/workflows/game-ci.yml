name: Game CI

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/game-ci.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: game-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: game

jobs:
  build-test:
    name: Typecheck, tests, build, smoke, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + content tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test (every scene + one level per planet)
        run: npm run smoke

      - name: Smoke test on the production bundle (dist/)
        run: npm run smoke -- --dist

      - name: Screenshots
        run: npm run screens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-corsair-screens
          path: game/screens/
          if-no-files-found: ignore
          retention-days: 14
