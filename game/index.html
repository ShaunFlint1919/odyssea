<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05040a" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Nova Corsair: a fast vertical-scrolling space shooter with an upgrade shop between missions." />
    <title>Nova Corsair</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05040a; }
      body {
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      }
      /* The game box stays inside the safe area (notch / cutout, also under hidden system bars); the
         body background fills the rest. src/config.ts reads this box once at boot to pick the height.
         No flex centring here: Phaser (Scale.CENTER_BOTH) centres the canvas with its own margins. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      .nc-unsupported {
        position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%);
        max-width: 300px; margin: 0 auto; color: #d8d4ec; font: 15px/1.5 sans-serif; text-align: center;
      }
      .nc-unsupported b { color: #2ee6c8; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      // The bundle targets ES2020. On an outdated browser or Android System WebView it cannot even
      // parse, so explain how to fix it instead of leaving a black screen. (ES5 on purpose.)
      (function () {
        try {
          new Function('var o = {}; return o?.a ?? 1;');
        } catch (e) {
          document.getElementById('game').innerHTML =
            '<p class="nc-unsupported"><b>Nova Corsair</b> needs a recent web engine.<br>' +
            'Update <b>Android System WebView</b> and <b>Chrome</b> from the Play Store ' +
            '(or use an up-to-date browser), then start the game again.</p>';
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
